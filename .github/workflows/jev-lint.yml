name: Jev Semantic Linter

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

jobs:
  semantic-lint:
    name: Semantic Lint & Architectural Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Run Jev Semantic Linter (CI Mode)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node dist/cli/index.js lint semantic --commit-range "origin/${{ github.base_ref }}...HEAD" --advisory
          else
            node dist/cli/index.js lint semantic --commit-range "HEAD~1" --advisory
          fi

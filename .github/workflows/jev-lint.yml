name: Jev Semantic Linter

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

jobs:
  semantic-lint:
    name: Semantic Lint & Architectural Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Jev Semantic Linter (CI Mode)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          npx jev-dev lint semantic --commit-range origin/main...HEAD --advisory
